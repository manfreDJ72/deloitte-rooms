<!DOCTYPE html>
<html lang="it">
<head>
  <script>
    if (new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery') {
      location.replace('recovery.html' + location.hash);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accesso – Deloitte Room Management</title>
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">

    <div class="login-logos">
      <img src="assets/area62.png" alt="Area62" class="logo-area62">
      <div class="lsep"></div>
      <img src="assets/deloitte.svg" alt="Deloitte" class="logo-deloitte">
    </div>

    <h1 class="login-headline">Room Management</h1>
    <p class="login-sub">Solaria &amp; Armonia · Gestione sale Deloitte</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" id="email"
               placeholder="utente@area62.it" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" id="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">
        Accedi
      </button>
    </form>
    <button type="button" class="btn btn-ghost" id="forgot-password" style="width:100%;margin-top:12px">Password dimenticata?</button>
    <p id="recovery-status" role="status" style="font-size:14px"></p>

    <p class="login-foot">
      Area62 Srl · Sistema di gestione immersiva Deloitte<br>
      Accesso riservato al personale autorizzato
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="js/config.js?v=67"></script>
<script src="js/app.js?v=67"></script>
<script src="js/db.js?v=67"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (new URLSearchParams(location.search).get('reason') === 'session') {
      const err = document.getElementById('login-error');
      err.textContent = 'La sessione è scaduta. Accedi nuovamente per caricare i dati condivisi.';
      err.style.display = 'block';
    }
    if (ls(LS.user) && await db.requireSession()) location.replace('dashboard.html');
  });

  document.getElementById('forgot-password').addEventListener('click', async function () {
    const input = document.getElementById('email');
    if (!input.reportValidity()) return;
    const status = document.getElementById('recovery-status');
    this.disabled = true;
    status.textContent = 'Richiesta in corso…';
    try {
      _initSb();
      const { error } = await _sb.auth.resetPasswordForEmail(input.value.trim().toLowerCase(), {
        redirectTo: 'https://rooms.area62.it/recovery.html'
      });
      if (error) throw error;
      status.textContent = 'Se l’indirizzo è registrato, riceverai un’email per scegliere la nuova password. Controlla anche lo spam.';
    } catch (e) {
      status.textContent = 'Invio non riuscito. Riprova tra qualche minuto.';
      this.disabled = false;
    }
  });

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const pw    = document.getElementById('password').value;
    const err   = document.getElementById('login-error');
    const btn   = e.target.querySelector('button[type=submit]');

    btn.disabled = true;
    btn.textContent = 'Accesso in corso...';
    err.style.display = 'none';

    try {
      await db.signIn(email, pw);
      btn.textContent = 'Caricamento dati...';
      try { await db.hydrateAll(); } catch (h) { console.error('hydrate', h); }
      window.location.href = 'dashboard.html';
    } catch (ex) {
      err.textContent = ex.message || 'Email o password non corretti.';
      err.style.display = 'block';
      document.getElementById('password').value = '';
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
</script>
</body>
</html>
